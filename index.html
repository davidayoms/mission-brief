<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Classified Mission Briefing</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial, sans-serif;
overflow:hidden;
}

/* START SCREEN */

#startScreen{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
z-index:10;
}

button{
padding:18px 40px;
font-size:22px;
background:black;
color:#00ff9c;
border:2px solid #00ff9c;
cursor:pointer;
}

button:hover{
background:#00ff9c;
color:black;
}

/* SLIDESHOW */

#slideshow{
position:relative;
width:100%;
height:100vh;
display:none;
}

.slide{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
opacity:0;
transition:opacity 2s;
}

.slide.active{
opacity:1;
}

/* SUBTITLES */

#subtitle{
position:absolute;
bottom:50px;
width:100%;
text-align:center;
font-size:32px;
padding:20px;
background:rgba(0,0,0,0.6);
}

</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">

<h1>IMF Secure Channel</h1>

<p>Classified Transmission Ready</p>

<button onclick="startMission()">BEGIN MISSION</button>

</div>


<!-- SLIDES -->

<div id="slideshow">

<div class="slide active" style="background-image:url('host1.jpg')"></div>

<div class="slide" style="background-image:url('host2.jpg')"></div>

<div class="slide" style="background-image:url('party.jpg')"></div>

<div id="subtitle"></div>

</div>


<!-- AUDIO -->

<audio id="music" src="mission.mp3" loop></audio>

<audio id="typing" src="typing.wav"></audio>

<audio id="explosion" src="explosion.wav"></audio>


<script>

const slides = document.querySelectorAll(".slide");

const subtitle = document.getElementById("subtitle");

let slideIndex = 0;

/* SCRIPT LINES */

const script = [

"Good evening Agent.",

"Our intelligence has identified two individuals.",

"Ayomide and Dumebi.",

"They are among the world's most powerful Joy Givers.",

"It has come to the attention of the agency...",

"that they plan to reveal their secret weapons",

"at a private gathering.",

"Your mission, should you choose to accept it...",

"is to infiltrate the party.",

"Blend in with other agents.",

"And have an unreasonable amount of fun.",

"This message will self destruct in 5 seconds."

];

let lineIndex = 0;

/* START */

function startMission(){

document.getElementById("startScreen").style.display="none";

document.getElementById("slideshow").style.display="block";

document.getElementById("music").play();

playScene();

}

/* PLAY SCENE */

function playScene(){

if(lineIndex < script.length){

subtitle.innerText = script[lineIndex];

document.getElementById("typing").currentTime=0;

document.getElementById("typing").play();

lineIndex++;

setTimeout(nextSlide,3500);

}

else{

startCountdown();

}

}

/* SLIDE CHANGE */

function nextSlide(){

slides[slideIndex].classList.remove("active");

slideIndex = (slideIndex + 1) % slides.length;

slides[slideIndex].classList.add("active");

playScene();

}

/* COUNTDOWN */

function startCountdown(){

let count = 5;

const timer = setInterval(function(){

subtitle.innerText = "This message will self destruct in " + count;

count--;

if(count < 0){

clearInterval(timer);

document.getElementById("explosion").play();

subtitle.innerText="TRANSMISSION TERMINATED";

}

},1000);

}

</script>

</body>
</html>
