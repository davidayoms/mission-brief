<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Classified Mission Briefing</title>

<style>

body{
background:black;
color:#00ff9c;
font-family:"Courier New", monospace;
margin:0;
overflow:hidden;
}

/* START SCREEN */

#startScreen{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

button{
background:black;
border:2px solid #00ff9c;
color:#00ff9c;
font-size:22px;
padding:15px 30px;
cursor:pointer;
font-family:"Courier New", monospace;
}

button:hover{
background:#00ff9c;
color:black;
}

/* TERMINAL */

#terminal{
display:none;
width:80%;
max-width:800px;
margin:100px auto;
font-size:22px;
line-height:1.6;
}

/* TOP TERMINAL BAR */

#header{
position:fixed;
top:10px;
left:20px;
font-size:14px;
color:#00ff9c;
}

/* SCAN LINE EFFECT */

.scanline{
position:fixed;
top:0;
width:100%;
height:2px;
background:#00ff9c;
animation:scan 4s linear infinite;
opacity:.2;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

/* COUNTDOWN */

#countdown{
font-size:40px;
margin-top:20px;
}

</style>
</head>

<body>

<div id="startScreen">

<h1>IMF Secure Channel</h1>

<p>Classified Transmission Ready</p>

<button onclick="startMission()">BEGIN MISSION</button>

</div>

<div id="header">
IMF Secure Channel — Level 7 Clearance
</div>

<div class="scanline"></div>

<div id="terminal">

<div id="text"></div>

<div id="countdown"></div>

</div>

<!-- AUDIO -->

<audio id="music" src="mission.mp3" loop></audio>
<audio id="typingSound" src="typing.mp3"></audio>
<audio id="explosionSound" src="explosion.mp3"></audio>

<script>

const lines = [

"INCOMING TRANSMISSION...",
"",
"Good evening, Agent.",
"",
"Intelligence from the agency has revealed unusual activity involving two individuals known as Ayomide and Dumebi.",
"",
"These individuals are believed to be among the world's top JOY GIVERS.",
"",
"It has come to the attention of the agency that they plan to reveal their secret weapons to the highest bidders at a private event.",
"",
"MISSION LOCATION: [Your Address]",
"DATE: [Your Date]",
"TIME: [Your Time]",
"",
"Your mission, should you choose to accept it...",
"",
"is to INFILTRATE the party, blend in with other agents,",
"and gather intelligence while having an unreasonable amount of fun.",
"",
"Primary Objectives:",
"- Dance when necessary",
"- Eat when possible",
"- Laugh without restraint",
"",
"Warning:",
"Exposure to the hosts may result in uncontrollable joy.",
"",
"This message will self destruct in 5 seconds."

];

let i=0;
let j=0;
let speed=40;

/* START MISSION */

function startMission(){

document.getElementById("startScreen").style.display="none";

document.getElementById("terminal").style.display="block";

document.getElementById("music").play();

typeWriter();

}

/* TYPEWRITER */

function typeWriter(){

if(i < lines.length){

if(j < lines[i].length){

document.getElementById("text").innerHTML += lines[i].charAt(j);

let typing=document.getElementById("typingSound");

typing.currentTime=0;

typing.play();

j++;

setTimeout(typeWriter,speed);

}

else{

document.getElementById("text").innerHTML += "<br>";

i++;

j=0;

setTimeout(typeWriter,500);

}

}

else{

startCountdown();

}

}

/* COUNTDOWN */

function startCountdown(){

let count=5;

let countdownEl=document.getElementById("countdown");

let timer=setInterval(function(){

countdownEl.innerHTML=count;

count--;

if(count<0){

clearInterval(timer);

document.getElementById("explosionSound").play();

document.body.innerHTML="<h1 style='color:red;text-align:center;margin-top:40vh;font-family:Courier New;'>TRANSMISSION TERMINATED</h1>";

}

},1000);

}

</script>

</body>
</html>
